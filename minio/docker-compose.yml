services:
  minio:
    image: minio/minio:latest
    container_name: sitefitness-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sitefitness}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sitefitness-minio-password}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  create-bucket:
    image: minio/mc:latest
    container_name: sitefitness-minio-create-bucket
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sitefitness}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sitefitness-minio-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-exercise-media}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      mc anonymous set download local/$$MINIO_BUCKET;
      "

volumes:
  minio_data:
